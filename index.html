<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">2048</h1>
            <div class="score-container">
                <div class="score">
                    <div class="score-label">得分</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="best-score">
                    <div class="score-label">最高分</div>
                    <div class="score-value" id="bestScore">0</div>
                </div>
                <div class="undo-count">
                    <div class="score-label">悔棋</div>
                    <div class="score-value" id="undoCount">3</div>
                </div>
            </div>
        </div>
        <div class="game-intro">
            <p>使用键盘方向键移动方块，相同数字的方块相碰时会合并成它们的和。</p>
            <button class="new-game-button" id="newGameButton">新游戏</button>
        </div>
        <div class="game-container" id="gameContainer">
            <div class="grid-container">
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
            </div>
            <div class="tile-container" id="tileContainer"></div>
            <div class="game-message" id="gameMessage">
                <p></p>
                <div class="lower">
                    <button class="retry-button" id="retryButton">再来一局</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
