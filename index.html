<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">2048</h1>
            <div class="score-container">
                <div class="main-scores">
                    <div class="score">
                        <div class="score-label">得分</div>
                        <div class="score-value" id="score">0</div>
                    </div>
                    <div class="best-score">
                        <div class="score-label">最高分</div>
                        <div class="score-value" id="bestScore">0</div>
                    </div>
                </div>
                <div class="stats-row">
                    <div class="undo-count">
                        <div class="score-label">悔棋</div>
                        <div class="score-value" id="undoCount">3</div>
                    </div>
                    <div class="moves-count">
                        <div class="score-label">步数</div>
                        <div class="score-value" id="movesCount">0</div>
                    </div>
                    <div class="time-count">
                        <div class="score-label">时间</div>
                        <div class="score-value" id="timeCount">00:00</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="game-intro">
            <p>使用键盘方向键移动方块，相同数字的方块相碰时会合并成它们的和。</p>
            <div class="button-container">
                <button class="new-game-button" id="newGameButton">新游戏</button>
                <button class="leaderboard-button" id="leaderboardButton">排行榜</button>
                <button class="theme-toggle-button" id="themeToggleButton">🌙</button>
            </div>
        </div>
        <div class="game-container" id="gameContainer">
            <div class="grid-container">
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
            </div>
            <div class="tile-container" id="tileContainer"></div>
            <div class="game-message" id="gameMessage">
                <p></p>
                <p class="rank-message" id="rankMessage"></p>
                <div class="lower">
                    <button class="retry-button" id="retryButton">再来一局</button>
                    <button class="continue-button" id="continueButton" style="display: none;">继续游戏</button>
                </div>
            </div>
        </div>
    </div>
    <div class="leaderboard-modal" id="leaderboardModal">
        <div class="leaderboard-content">
            <h2 class="leaderboard-title">排行榜</h2>
            <div class="leaderboard-list" id="leaderboardList">
                <p class="no-records">暂无记录</p>
            </div>
            <div class="leaderboard-buttons">
                <button class="clear-leaderboard-button" id="clearLeaderboardButton">清空记录</button>
                <button class="close-leaderboard-button" id="closeLeaderboardButton">关闭</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
